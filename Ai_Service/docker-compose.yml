version: '3.8'

services:
  ai-service:
    build: .
    container_name: edupath-ai-service
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_PRIMARY_MODEL=${GEMINI_PRIMARY_MODEL:-gemini-3.5-flash-lite}
      - GEMINI_FALLBACK_MODELS=${GEMINI_FALLBACK_MODELS:-gemini-3.1-flash-lite,gemini-3.8-flash,gemini-flash-lite-latest}
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY:-edupath-internal-secret-key}
    restart: unless-stopped
